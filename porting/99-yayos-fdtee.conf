# YaYOS — fdtee: tee default audio output to ALSA loopback for WebRTC streaming.
# Requires snd-aloop kernel module (auto-loaded via /etc/modprobe.d/99-yayos.conf).
# Set ALSA_PCMOUT=fdtee before launching apps whose audio you want to stream.
# Change hw:Audio,0 to match your USB audio card name (check: aplay -l).
pcm.fdtee {
    type plug
    slave.pcm yayos_tee_multi
    route_policy duplicate
}
pcm.yayos_tee_multi {
    type multi
    slaves.a.pcm { type plug slave.pcm "hw:Audio,0" }
    slaves.a.channels 2
    slaves.b.pcm { type hw card Loopback device 0 }
    slaves.b.channels 2
    bindings.0 { slave a channel 0 }
    bindings.1 { slave a channel 1 }
    bindings.2 { slave b channel 0 }
    bindings.3 { slave b channel 1 }
}
